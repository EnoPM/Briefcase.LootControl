name: Publish Windows UE4SS mod
run-name: Windows UE4SS mod release from VERSION
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ue4ss-mod-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: EnoPM/BriefcaseNative
          ref: v0.8.3
          path: framework
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: framework/repositories/Briefcase.LootControl
          persist-credentials: false
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content framework/repositories/Briefcase.LootControl/VERSION -Raw).Trim()
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Invalid mod VERSION.' }
          "MOD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install tested Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update
      - name: Fetch pinned UE4SS dependencies
        shell: pwsh
        env:
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
        run: |
          if (-not $env:UPSTREAM_READ_TOKEN) { throw 'UPSTREAM_READ_TOKEN is required for the gated Unreal submodule.' }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:UPSTREAM_READ_TOKEN))
          Write-Output "::add-mask::$encoded"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + $encoded
          ./framework/scripts/build/Fetch-Dependencies.ps1
      - name: Build and test Windows mod
        shell: pwsh
        run: |
          ./framework/scripts/ue4ss/Build-ServerMods.ps1 -BuildDirectory ./framework/build-ue4ss-ninja -ModTargets 'Briefcase.LootControl.UE4SS','Briefcase.LootControl.Config'
          if ($LASTEXITCODE) { throw 'UE4SS mod build failed.' }
          ctest --test-dir ./framework/build-ue4ss-ninja -R 'Briefcase.DeceiveInc.Contracts|Briefcase.LootControl.Config' --output-on-failure
          if ($LASTEXITCODE) { throw 'Mod tests failed.' }
      - name: Package and publish verified mod
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          $archive = ./framework/scripts/ue4ss/Package-ServerMod.ps1 -RepositoryName Briefcase.LootControl -InstallName BriefcaseLootControl -BuildDirectory ./framework/build-ue4ss-ninja
          $draft = $env:RELEASE_DRAFT -eq 'true'
          ./framework/scripts/ue4ss/Publish-ServerMod.ps1 -RepositoryName Briefcase.LootControl -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -Archive $archive -Draft:$draft
